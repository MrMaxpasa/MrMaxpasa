name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generar los SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#D4AF37&color_dots=#0d1117,#3b2f14,#6b5320,#a8822c,#F3D77A
            dist/github-contribution-grid-snake.svg?color_snake=#8B6F47&color_dots=#F5E6C8,#e0c98a,#c9a94a,#a8822c,#7a5f22

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
