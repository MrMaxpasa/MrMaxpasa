name: Lamina de hallazgos

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  hallazgos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dibujar la lamina
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFIL_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/hallazgos.mjs

      - name: Commitear si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hallazgos.svg
          if git diff --cached --quiet; then
            echo "La lamina no ha cambiado desde ayer."
          else
            git commit -m "Actualizar la lamina de hallazgos"
            git push
          fi
