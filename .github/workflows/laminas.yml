name: Laminas del perfil

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  laminas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dibujar las laminas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFIL_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/laminas.mjs

      - name: Commitear si han cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/registro.svg assets/hallazgos.svg
          if git diff --cached --quiet; then
            echo "Las laminas no han cambiado desde ayer."
          else
            git commit -m "Actualizar las laminas del perfil"
            git push
          fi
